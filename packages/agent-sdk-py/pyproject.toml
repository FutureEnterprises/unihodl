[project]
name = "unihodl-agent"
version = "0.2.0"
description = "UNIHODL Agent Handoff SDK — pass human session context to AI agents (Claude, Gemini, OpenAI, LangGraph). Decision-continuity protocol."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "UNIHODL", email = "developers@unihodl.app" }
]
keywords = [
  "unihodl",
  "agent",
  "ai",
  "context",
  "mcp",
  "claude",
  "gemini",
  "openai",
  "langgraph",
  "handoff",
  "resume",
  "decision-continuity"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://unihodl.app/sdk"
Documentation = "https://unihodl.app/sdk/spec"
Repository = "https://github.com/FutureEnterprises/unihodl-sdk"
Issues = "https://github.com/FutureEnterprises/unihodl-sdk/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unihodl_agent"]
